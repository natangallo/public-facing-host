global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend http_front
    bind *:80
    acl host_service hdr(host) -i service.duckdns.org
    use_backend service_backend_tls if host_service
    default_backend default_backend

frontend https_front
    bind *:443
    acl host_service hdr(host) -i service.duckdns.org
    use_backend service_backend_tls if host_service
    default_backend default_backend

backend service_backend_tls
    mode tcp
    server service 127.0.0.1:8443 check

backend default_backend
    mode tcp
    server fallback 127.0.0.1:8443
